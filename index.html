<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="淡江課表">
  <title>淡江課表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="app-title">淡江課表</div>
    <div id="semesterText" class="app-subtitle">尚未同步</div>
  </div>
  <button id="settingsButton" class="icon-button" type="button" aria-label="設定">⚙</button>
</header>

<main class="main">
  <section class="status-card">
    <div>
      <div id="studentName" class="student-name">尚未登入</div>
      <div id="studentInfo" class="student-sub">目前使用本機課表</div>
    </div>
    <div id="networkStatus" class="network-pill">離線可用</div>
  </section>

  <section class="week-bar">
    <button id="prevWeek" class="nav-button" type="button">‹</button>
    <div class="week-center">
      <button id="todayButton" class="today-button" type="button">今天</button>
      <div id="weekText" class="week-text"></div>
    </div>
    <button id="nextWeek" class="nav-button" type="button">›</button>
  </section>

  <section id="schedule" class="schedule"></section>
</main>

<dialog id="courseDialog" class="dialog">
  <form id="courseForm" class="dialog-content">
    <div class="dialog-header">
      <div>
        <div id="courseTitle" class="dialog-title"></div>
        <div id="courseSubtitle" class="dialog-subtitle"></div>
      </div>
      <button id="closeCourse" class="close-button" type="button">✕</button>
    </div>

    <label class="field-label">
      顯示課程名稱
      <input id="customName" type="text" placeholder="留空＝使用學校原名稱">
    </label>

    <div class="info-grid">
      <div class="info-box"><span>學校原名稱</span><strong id="schoolName">—</strong></div>
      <div class="info-box"><span>開課序號</span><strong id="courseIdText">—</strong></div>
      <div class="info-box"><span>座號</span><strong id="seatNumber">—</strong></div>
      <div class="info-box"><span>學分</span><strong id="credits">—</strong></div>
      <div class="info-box"><span>系所</span><strong id="department">—</strong></div>
      <div class="info-box"><span>年級／班別</span><strong id="gradeClass">—</strong></div>
    </div>

    <div>
      <div class="section-title">上課時段</div>
      <div id="timesList" class="times-list"></div>
    </div>

    <div id="courseLinks" class="course-links"></div>

    <label class="field-label">
      課程說明
      <textarea id="description" rows="5" readonly></textarea>
    </label>

    <label class="field-label">
      我的備註
      <textarea id="note" rows="4" placeholder="例如：帶筆電、考試範圍……"></textarea>
    </label>

    <div>
      <div class="journal-row">
        <div class="section-title">我的記事</div>
        <button id="addJournal" class="small-button" type="button">＋新增</button>
      </div>
      <div id="journalList" class="journal-list"></div>
    </div>

    <div class="dialog-actions">
      <button id="cancelCourse" class="secondary-button" type="button">取消</button>
      <button class="primary-button" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog" class="dialog">
  <div class="dialog-content">
    <div class="dialog-header">
      <div>
        <div class="dialog-title">設定</div>
        <div class="dialog-subtitle">課表顯示、帳號與本機資料</div>
      </div>
      <button id="closeSettings" class="close-button" type="button">✕</button>
    </div>

    <section class="settings-section">
      <div class="section-title">顯示星期</div>
      <div id="dayChecks" class="checks"></div>
    </section>

    <section class="settings-section">
      <div class="section-title">顯示節次</div>
      <div id="periodChecks" class="checks"></div>
    </section>

    <section class="settings-section">
      <div class="section-title">課程卡片</div>
      <label class="switch-row">
        <span>顯示座號</span>
        <input id="showSeat" type="checkbox">
      </label>
    </section>

    <section class="settings-section">
      <div class="section-title">淡江帳號</div>

      <div class="settings-line">
        <span>姓名</span>
        <strong id="settingStudentName">尚未取得</strong>
      </div>

      <div class="settings-line">
        <span>學號</span>
        <strong id="settingStudentId">尚未取得</strong>
      </div>

      <button id="tkuLoginButton" class="settings-button" type="button">
        🔐 前往淡江 SSO 登入
      </button>

      <button id="tkuLogoutButton" class="settings-button" type="button">
        🚪 淡江校務系統登出
      </button>

      <p class="muted">
        登入與登出都會在目前視窗進行。淡江 SSO 登入完成後是否能自動導回本 App，
        取決於淡江目前的 SSO 導轉設定；本 App 不保存淡江密碼或 Cookie。
      </p>
    </section>

    <section class="settings-section">
      <div class="section-title">本機資料</div>

      <button id="clearCoursesButton" class="settings-button" type="button">
        🗑 清除課表
      </button>

      <button id="exportData" class="settings-button" type="button">
        匯出課表 JSON
      </button>

      <label class="settings-button file-button">
        匯入課表 JSON
        <input id="importData" type="file" accept=".json,application/json">
      </label>

      <button id="loadDemo" class="settings-button" type="button">
        載入範例課表
      </button>

      <button id="logoutAppButton" class="settings-button danger-button" type="button">
        🔒 登出並清除本機資料
      </button>
    </section>

    <section class="settings-section">
      <div class="section-title">淡江同步</div>
      <p class="muted">
        下一階段把 TMWC020 的課程與座號，以及課表頁面的星期、節次、教師、教室合併，
        再同步回手機。
      </p>
    </section>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
