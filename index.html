<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263238"><meta name="apple-mobile-web-app-capable" content="yes"><title>淡江課表</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div><div class="app-title">淡江課表</div><div id="semesterText" class="sub">尚未同步</div></div><button id="settingsButton" class="icon">⚙</button></header>
<main><section class="status"><div><b id="studentName">尚未登入</b><div id="studentInfo" class="sub">目前使用本機課表</div></div><span id="networkStatus" class="pill">離線可用</span></section>
<section class="weekbar"><button id="prevWeek">‹</button><div><button id="todayButton" class="today">今天</button><div id="weekText" class="sub"></div></div><button id="nextWeek">›</button></section>
<section id="schedule" class="schedule"></section></main>
<dialog id="courseDialog"><form id="courseForm" class="dialog"><div class="head"><div><h2 id="courseTitle"></h2><div id="courseSubtitle" class="sub"></div></div><button type="button" id="closeCourse">✕</button></div><label>顯示課程名稱<input id="customName" placeholder="留空＝學校原名稱"></label><div id="courseInfo" class="info-grid"></div><div><b>上課時段</b><div id="timesList"></div></div><div id="courseLinks"></div><label>課程說明<textarea id="description" readonly></textarea></label><label>我的備註<textarea id="note" placeholder="例如：帶筆電"></textarea></label><div><div class="row"><b>我的記事</b><button type="button" id="addJournal">＋新增</button></div><div id="journalList"></div></div><div class="actions"><button type="button" id="cancelCourse">取消</button><button class="primary">儲存</button></div></form></dialog>
<dialog id="settingsDialog"><div class="dialog"><div class="head"><div><h2>設定</h2><div class="sub">課表顯示、帳號與本機資料</div></div><button type="button" id="closeSettings">✕</button></div>
<section><b>顯示星期</b><div id="dayChecks" class="checks"></div></section><section><b>顯示節次</b><div id="periodChecks" class="checks"></div></section><section><label class="row">顯示座號<input id="showSeat" type="checkbox"></label></section>
<section><b>淡江帳號</b><div class="line"><span>姓名</span><strong id="settingStudentName">尚未取得</strong></div><div class="line"><span>學號</span><strong id="settingStudentId">尚未取得</strong></div><button id="tkuLoginButton">🔐 開啟淡江 SSO 登入</button><button id="tkuLogoutButton">🚪 淡江校務系統登出</button><p class="sub">SSO 是淡江官方網頁；本 App 不保存淡江密碼。</p></section>
<section><b>本機資料</b><button id="clearCoursesButton">🗑 清除課表</button><button id="exportData">匯出課表 JSON</button><label class="file">匯入課表 JSON<input id="importData" type="file" accept="application/json,.json"></label><button id="loadDemo">載入範例課表</button><button id="logoutAppButton" class="danger">🔒 登出並清除本機資料</button></section>
<section><b>淡江同步</b><p class="sub">下一階段把 TMWC020 的課程／座號與課表頁面的時段資料合併。</p></section></div></dialog>
<script src="app.js"></script></body></html>
