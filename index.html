<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263238">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="淡江課表">
  <title>淡江課表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">淡江課表</div>
      <div id="semesterText" class="brand-subtitle">尚未同步</div>
    </div>
    <button id="settingsButton" class="icon-btn" type="button" aria-label="設定">⚙</button>
  </header>

  <main class="page">
    <section class="student-card">
      <div>
        <div id="studentName" class="student-name">尚未登入</div>
        <div id="studentInfo" class="student-info">目前使用本機課表</div>
      </div>
      <span id="networkStatus" class="status-pill">離線可用</span>
    </section>

    <section class="week-nav">
      <button id="prevWeek" class="nav-btn" type="button">‹</button>
      <button id="todayButton" class="today-btn" type="button">
        <span id="weekText">本週</span>
      </button>
      <button id="nextWeek" class="nav-btn" type="button">›</button>
    </section>

    <section id="schedule" class="schedule"></section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section id="courseModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="courseTitle">
      <div class="modal-header">
        <div class="modal-heading">
          <div id="courseTitle" class="modal-title">課程</div>
          <div id="courseSubtitle" class="modal-subtitle"></div>
        </div>
        <button id="closeCourse" class="close-btn" type="button">✕</button>
      </div>

      <div class="modal-body">
        <label class="field">
          <span>顯示課程名稱</span>
          <input id="customName" type="text" placeholder="留空＝使用學校原名稱">
        </label>

        <div class="info-grid">
          <div class="info-item"><span>學校原名稱</span><strong id="schoolName">—</strong></div>
          <div class="info-item"><span>開課序號</span><strong id="courseIdText">—</strong></div>
          <div class="info-item"><span>座號</span><strong id="seatNumber">—</strong></div>
          <div class="info-item"><span>學分</span><strong id="credits">—</strong></div>
          <div class="info-item"><span>系所</span><strong id="department">—</strong></div>
          <div class="info-item"><span>年級／班別</span><strong id="gradeClass">—</strong></div>
        </div>

        <div class="block">
          <h3>上課時段</h3>
          <div id="timesList" class="stack"></div>
        </div>

        <div id="courseLinks" class="links"></div>

        <label class="field">
          <span>課程說明</span>
          <textarea id="description" rows="5" readonly></textarea>
        </label>

        <label class="field">
          <span>我的備註</span>
          <textarea id="note" rows="4" placeholder="例如：考試範圍、要帶什麼……"></textarea>
        </label>

        <div class="block">
          <div class="block-head"><h3>我的記事</h3><button id="addJournal" class="small-btn" type="button">＋新增</button></div>
          <div id="journalList" class="stack"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="cancelCourse" class="btn secondary" type="button">取消</button>
        <button id="saveCourseButton" class="btn primary" type="button">儲存</button>
      </div>
    </section>

    <section id="settingsModal" class="modal settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div class="modal-heading">
          <div id="settingsTitle" class="modal-title">設定</div>
          <div class="modal-subtitle">顯示方式與本機資料</div>
        </div>
        <button id="closeSettings" class="close-btn" type="button">✕</button>
      </div>

      <div class="modal-body">
        <section class="setting-block">
          <h3>顯示星期</h3>
          <div id="dayChecks" class="check-grid"></div>
        </section>

        <section class="setting-block">
          <h3>顯示節次</h3>
          <div id="periodChecks" class="check-grid"></div>
        </section>

        <section class="setting-block">
          <h3>課程卡片</h3>
          <label class="switch-row"><span>顯示座號</span><input id="showSeat" type="checkbox"></label>
        </section>

        <section class="setting-block">
          <h3>淡江帳號</h3>
          <div class="account-row"><span>姓名</span><strong id="settingStudentName">尚未取得</strong></div>
          <div class="account-row"><span>學號</span><strong id="settingStudentId">尚未取得</strong></div>
          <button id="tkuLoginButton" class="full-btn" type="button">🔐 前往淡江 SSO 登入</button>
          <button id="tkuLogoutButton" class="full-btn" type="button">🚪 淡江校務系統登出</button>
          <p class="hint">本 App 不保存淡江密碼或 Cookie。SSO 是否導回本 App 由淡江的登入系統決定。</p>
        </section>

        <section class="setting-block">
          <h3>本機資料</h3>
          <button id="clearCoursesButton" class="full-btn" type="button">🗑 清除課表</button>
          <button id="exportData" class="full-btn" type="button">匯出課表 JSON</button>
          <label class="full-btn file-btn">匯入課表 JSON<input id="importData" type="file" accept="application/json,.json"></label>
          <button id="loadDemo" class="full-btn" type="button">載入範例課表</button>
          <button id="logoutAppButton" class="full-btn danger" type="button">🔒 登出並清除本機資料</button>
        </section>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
