<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="淡江課表">
  <title>淡江課表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="app-title">淡江課表</div>
    <div class="app-subtitle" id="semesterText">尚未同步</div>
  </div>
  <button id="settingsButton" class="icon-button" aria-label="設定">⚙</button>
</header>

<main class="main">
  <section class="status-card">
    <div>
      <div class="student-name" id="studentName">尚未登入</div>
      <div class="student-sub" id="studentInfo">目前使用本機課表</div>
    </div>
    <div id="networkStatus" class="network-pill">離線可用</div>
  </section>

  <section class="week-bar">
    <button id="prevWeek" class="nav-button">‹</button>
    <div class="week-center">
      <button id="todayButton" class="today-button">今天</button>
      <div id="weekText" class="week-text"></div>
    </div>
    <button id="nextWeek" class="nav-button">›</button>
  </section>

  <section id="schedule" class="schedule"></section>
</main>

<dialog id="courseDialog" class="dialog">
  <form id="courseForm" class="dialog-content">
    <div class="dialog-header">
      <div>
        <div id="courseTitle" class="dialog-title"></div>
        <div id="courseSubtitle" class="dialog-subtitle"></div>
      </div>
      <button type="button" id="closeCourse" class="close-button">✕</button>
    </div>

    <label class="field-label">
      顯示課程名稱
      <input id="customName" type="text" placeholder="留空＝使用學校原名稱">
    </label>

    <div class="info-grid">
      <div class="info-box"><span>學校原名稱</span><strong id="schoolName"></strong></div>
      <div class="info-box"><span>開課序號</span><strong id="courseIdText"></strong></div>
      <div class="info-box"><span>座號</span><strong id="seatNumber"></strong></div>
      <div class="info-box"><span>學分</span><strong id="credits"></strong></div>
      <div class="info-box"><span>系所</span><strong id="department"></strong></div>
      <div class="info-box"><span>年級／班別</span><strong id="gradeClass"></strong></div>
    </div>

    <div>
      <div class="section-title">上課時段</div>
      <div id="timesList" class="times-list"></div>
    </div>

    <div class="course-links" id="courseLinks"></div>

    <label class="field-label">
      課程說明
      <textarea id="description" rows="5" readonly></textarea>
    </label>

    <label class="field-label">
      我的備註
      <textarea id="note" rows="4" placeholder="例如：帶筆電、考試範圍……"></textarea>
    </label>

    <div>
      <div class="journal-row">
        <div class="section-title">我的記事</div>
        <button type="button" id="addJournal" class="small-button">＋新增</button>
      </div>
      <div id="journalList" class="journal-list"></div>
    </div>

    <div class="dialog-actions">
      <button type="button" id="cancelCourse" class="secondary-button">取消</button>
      <button type="submit" class="primary-button">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog" class="dialog">
  <div class="dialog-content">
    <div class="dialog-header">
      <div>
        <div class="dialog-title">設定</div>
        <div class="dialog-subtitle">課表顯示與本機資料</div>
      </div>
      <button type="button" id="closeSettings" class="close-button">✕</button>
    </div>

    <section class="settings-section">
      <div class="section-title">顯示星期</div>
      <div class="checks" id="dayChecks"></div>
    </section>

    <section class="settings-section">
      <div class="section-title">顯示節次</div>
      <div class="checks" id="periodChecks"></div>
    </section>

    <section class="settings-section">
      <div class="section-title">課程卡片</div>
      <label class="switch-row">
        <span>顯示座號</span>
        <input id="showSeat" type="checkbox">
      </label>
    </section>

    <section class="settings-section">
      <div class="section-title">本機資料</div>
      <button id="loadDemo" class="settings-button">載入目前範例課表</button>
      <button id="exportData" class="settings-button">匯出課表 JSON</button>
      <label class="settings-button file-button">
        匯入課表 JSON
        <input id="importData" type="file" accept=".json,application/json">
      </label>
      <button id="clearData" class="settings-button danger-button">清除本機資料</button>
    </section>

    <section class="settings-section">
      <div class="section-title">學生資料</div>
      <div class="settings-line"><span>姓名</span><strong id="settingStudentName">尚未取得</strong></div>
      <div class="settings-line"><span>學號</span><strong id="settingStudentId">尚未取得</strong></div>
    </section>

    <section class="settings-section">
      <div class="section-title">淡江同步</div>
      <p class="muted">下一階段會接上淡江 SSO、TMWC020 與課表頁面，自動同步正式資料。</p>
    </section>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
