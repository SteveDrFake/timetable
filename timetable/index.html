<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263238">
  <meta name="description" content="淡江學生課表：課表、備註、記事、離線使用">
  <title>淡江課表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="title">淡江課表</div>
      <div class="subtitle" id="semesterLabel">尚未同步</div>
    </div>
    <div class="top-actions">
      <button id="syncBtn" class="secondary">同步</button>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙</button>
    </div>
  </header>

  <main class="container">
    <section class="status-card">
      <div>
        <div id="studentName" class="status-title">尚未登入校務系統</div>
        <div id="studentId" class="status-text">可先使用內建範例資料測試</div>
      </div>
      <div id="onlineStatus" class="pill">離線可用</div>
    </section>

    <div id="notice" class="notice hidden"></div>

    <section class="week-nav">
      <button id="prevWeek">‹</button>
      <div class="week-title">
        <button id="todayBtn">今天</button>
        <div id="weekLabel"></div>
      </div>
      <button id="nextWeek">›</button>
    </section>

    <section id="scheduleGrid" class="schedule-grid"></section>
  </main>

  <dialog id="courseDialog">
    <form method="dialog" id="courseForm" class="dialog-form">
      <div class="dialog-header">
        <div>
          <div class="dialog-title" id="dialogTitle">課程</div>
          <div class="dialog-subtitle" id="dialogSchoolName"></div>
        </div>
        <button value="cancel" class="icon-btn">✕</button>
      </div>

      <input type="hidden" id="courseId">

      <label>顯示課程名稱
        <input id="customName" type="text" placeholder="留空則使用學校原名稱">
      </label>

      <label>學校原始名稱
        <input id="schoolName" type="text" readonly>
      </label>

      <div class="two-col">
        <label>教師
          <input id="teacher" type="text" readonly>
        </label>
        <label>教室
          <input id="room" type="text" readonly>
        </label>
      </div>

      <label>課程說明
        <textarea id="description" rows="5" readonly></textarea>
      </label>

      <label>我的備註
        <textarea id="note" rows="4" placeholder="例如：記得帶筆電、考試範圍……"></textarea>
      </label>

      <div class="journal-header">
        <strong>我的記事</strong>
        <button type="button" id="addJournalBtn" class="secondary small">＋新增</button>
      </div>
      <div id="journalList" class="journal-list"></div>

      <div class="dialog-actions">
        <button type="button" id="deleteCourseBtn" class="danger">刪除本機課程</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-form">
      <div class="dialog-header">
        <div>
          <div class="dialog-title">設定</div>
          <div class="dialog-subtitle">本機資料與同步</div>
        </div>
        <button value="cancel" class="icon-btn">✕</button>
      </div>

      <div class="settings-block">
        <strong>資料</strong>
        <button type="button" id="loadDemoBtn" class="secondary">載入範例課表</button>
        <button type="button" id="exportBtn" class="secondary">匯出 JSON</button>
        <label class="file-btn">
          匯入 JSON
          <input id="importFile" type="file" accept=".json,application/json">
        </label>
        <button type="button" id="clearBtn" class="danger">清除本機全部資料</button>
      </div>

      <div class="settings-block">
        <strong>同步方式</strong>
        <p class="muted">
          「同步」會提示如何啟動本機 Playwright 同步程式。
          淡江帳號密碼不會寫進這個網站。
        </p>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
